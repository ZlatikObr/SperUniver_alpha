            {"source": "опрос / файл / расчёт / web", "quote": "конкретная цитата или факт"}
          ]
        }
      ],
      "overall_health": "краткий вывод об общем состоянии бизнеса (2-3 предложения)"
    },
    "recommended_zone_ids": ["финансы", "маркетинг"],
    "data_sources": ["опрос"],
    "disclaimer": "Анализ носит рекомендательный характер и подготовлен на основе предоставленных данных. Для принятия управленческих решений рекомендуется верификация с профильным консультантом."
  }
