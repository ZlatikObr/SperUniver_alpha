[project]
name = "speruniver-alpha-puls"
version = "0.1.0"
description = "AI-powered business screening prototype for SperUniver alpha."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "requests>=2.31.0",
    "streamlit>=1.32.0",
    "pdfplumber>=0.10.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=6.0.0",
    "markdown>=3.5.0",
    "weasyprint>=60.0",
    "matplotlib>=3.8.0",
    "reportlab>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["artefacts/artefact-2-prototype/tests"]
pythonpath = ["."]
